<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Widgets Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem;
      min-height: 100vh;
    }

    header {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 3rem auto;
    }

    header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .widget-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid #334155;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .widget-title {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .preview-frame {
      width: 100%;
      height: 220px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #000;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .copy-btn {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
    }

    .copy-btn:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .copy-btn.copied {
      background-color: #22c55e;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>👾 Notion Widgets</h1>
    <p>Click any button below to copy the link, then paste it into an <strong>/embed</strong> block in Notion.</p>
  </header>

  <main class="gallery">

    <!-- WIDGET CARD 1 -->
    <div class="widget-card">
      <div class="widget-title">Pixel Dynamic Clock</div>
      <div class="preview-frame">
        <iframe src=></iframe>
      </div>
      <button class="copy-btn" onclick="copyWidgetLink(getWidgetLink('./widgets/pixel-clock/index.html'), this)">
        📋 Copy Notion Embed Link
      </button>
    </div>

    <!-- WIDGET CARD 2 (Template for your next widget) -->
    <!--
    <div class="widget-card">
      <div class="widget-title">New Widget</div>
      <div class="preview-frame">
        <iframe src="./widgets/your-new-widget/index.html"></iframe>
      </div>
      <button class="copy-btn" onclick="copyWidgetLink('./widgets/your-new-widget/index.html', this)">
        📋 Copy Notion Embed Link
      </button>
    </div>
    -->

  </main>

  <script>
    function copyWidgetLink(relativePath, buttonEl) {
      // Constructs the full GitHub Pages absolute URL automatically
      const absoluteUrl = new URL(relativePath, window.location.href).href;

      navigator.clipboard.writeText(absoluteUrl).then(() => {
        const originalText = buttonEl.innerText;
        buttonEl.innerText = '✅ Link Copied!';
        buttonEl.classList.add('copied');

        setTimeout(() => {
          buttonEl.innerText = originalText;
          buttonEl.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        console.error('Failed to copy: ', err);
      });
    }

    getWidgetLink = (relativePath) => {
      return new URL(relativePath, window.location.href).href;
    };
  </script>

</body>
</html>
